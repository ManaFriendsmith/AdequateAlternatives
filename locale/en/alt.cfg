fast-logistic-science=The network must be faster!
chemical-industry-pack=Study of methods of chemical synthesis.
industrial-logistic-science=Study of larger-scale transportation.
shield-testing=Using energy shields as reusable test-targets for military research.

pumped-power-storage=Energy storage alternative that charges by pumping water uphill and discharges by allowing the outflow to spin a turbine. You'll have to use your imagination on this one.
solar-field=Optimized interconnected solar arrays.
the-needs-of-the-many=Outweigh The Needs Of The Few, Or The One
