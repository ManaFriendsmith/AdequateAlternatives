[technology-description]
bio-anomaly-studies=Unlocks studying the remains of biter nests to discover new technology. Royal jelly and peanut butter are dropped by defeated spitter and biter spawners, respectively, but not those founded by expansion parties.
advanced-anomaly-studies=More thorough investigation of biter biology.
biter-nest-analysis=Analyze biter biology to discover unorthodox technologies. Once you have tech points, press __CONTROL__adequate-alternatives-gui-toggle__ to choose which research to pursue.
deep-space-analysis=Explore interstellar space to discover unorthodox technologies. Once you have tech points, press __CONTROL__adequate-alternatives-gui-toggle__ to choose which research to pursue.

demolisher-studies=Unlocks studying the remains of demolishers to discover new technology. Worm guts are harvested from demolisher corpses.
demolisher-analysis=Analyze biter and demolisher biology to discover unorthodox technologies. Once you have tech points, press __CONTROL__adequate-alternatives-gui-toggle__ to choose which research to pursue.

precursor-studies=Unlocks studying the Fulgoran precursors to discover new technology. Gene vaults can be found in vault ruins.
precursor-analysis=Analyze biter and precursor biology to discover unorthodox technologies. Once you have tech points, press __CONTROL__adequate-alternatives-gui-toggle__ to choose which research to pursue.

captive-biter-nest-analysis=Allows sustainable collection of biter biological data.
pentapod-studies=Unlocks studying the remains of egg rafts to discover new technology. Primordial pho is dropped by defeated pentapod egg rafts, but not those founded by expansion parties.
pentapod-analysis=Analyze biter and pentapod biology to discover unorthodox technologies. Once you have tech points, press __CONTROL__adequate-alternatives-gui-toggle__ to choose which research to pursue.

iron-leaching=Using acid to remove impurities from iron resulting in a greater yield of usable metal.
copper-leaching=Using acid to remove impurities from copper resulting in a greater yield of usable metal.
steel-rod=Only aliens could figure out how to make structural rods out of more than one material.
wooden-rail=Railways with wooden ties. What a concept.
steel-pipe=Legend has it that on the Other Planet, all the pipes are made of steel and they had to research how to make them with iron.
raw-concrete=Concrete can be made from unrefined stone if it is reinforced with sturdy rebar.
insulated-wire=Seems fake but okay
stone-circuit=I don't speak Celtic.
modern-circuit=Let's do it properly this time.
coked-steel=Adding carbon is probably a good idea. You usually need that.
difference-engine=They're the same picture.
cloud-computing=The calculation is someone else's problem.
oil-cut-gear=Lubricated cutting heads allow for faster and cleaner machining.
oil-cut-wire=Lubricated cutting heads allow for faster and cleaner machining.
fuel-polymerization=Processing hydrocarbons into other hydrocarbons.
oil-hacking=THERE'S A DIFFERENCE
liquid-coalifaction=Condense oilbound carbon into solid form and then burn it anyway.
